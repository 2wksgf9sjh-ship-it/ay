<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My iPhone</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17191d;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#16181b}button,input{font:inherit}button{cursor:pointer;border:0}
#setup{min-height:100svh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#dceaf2,#a6c2d2)}.setupcard{background:white;border-radius:28px;padding:28px;width:min(390px,100%);box-shadow:0 20px 60px #0002}.setupcard h1{margin:0 0 8px;font-size:26px}.setupcard p{color:#66737b;line-height:1.5}.setupcard input{width:100%;padding:15px;border:1px solid #d5dce0;border-radius:14px;margin:12px 0}.primary{width:100%;padding:15px;border-radius:14px;background:#111;color:white;font-weight:700}

.pass{background:linear-gradient(155deg,#6f8da5,#b6cbd7 52%,#718ca1);color:white;text-align:center;padding:62px 20px}.dots{display:flex;justify-content:center;gap:17px;margin:26px}.dot{width:12px;height:12px;border:1px solid white;border-radius:50%}.dot.on{background:white}.keypad{display:grid;grid-template-columns:repeat(3,68px);justify-content:center;gap:12px;margin-top:28px}.keypad button{height:58px;border-radius:50%;background:#ffffff32;color:white;font-size:24px}
.home{padding:18px 20px 24px;background:linear-gradient(150deg,#87a7bb,#cbdbe2 60%,#819daf);color:white;overflow:auto}.homehead{display:flex;justify-content:space-between;align-items:center;font-size:13px;text-shadow:0 1px 4px #456}.widgetgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 28px}.widget{border-radius:22px;background:#ffffffc9;color:#24333d;padding:14px;min-height:116px;box-shadow:0 6px 18px #29445b22}.weatherbig{font-size:34px}.temp{font-size:27px;font-weight:600}.muted{color:#667782;font-size:12px}.calendar{display:flex;gap:9px;align-items:center}.calnum{font-size:34px;color:#e56b60;font-weight:700}.event{font-size:12px;line-height:1.5}.appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 9px}.appicon{width:59px;height:59px;border-radius:17px;margin:0 auto 6px;display:grid;place-items:center;font-size:27px;color:white;box-shadow:0 4px 10px #24394b38}.appname{text-align:center;color:white;font-size:11px;text-shadow:0 1px 3px #234}.appbtn{background:none;color:white;padding:0}.dock{margin-top:25px;padding:12px;border-radius:25px;background:#ffffff55;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.appview{background:#f4f5f7;display:none;flex-direction:column}.bar{height:52px;flex-shrink:0;background:#fff;border-bottom:1px solid #e6e7e9;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-weight:700}.bar button{background:none;font-size:23px;color:#222}.scroll{overflow:auto;flex:1}.bottomnav{height:55px;display:flex;justify-content:space-around;align-items:center;background:#fff;border-top:1px solid #eee;flex-shrink:0}.bottomnav button{background:none;color:#666;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}.bottomnav b{font-size:20px}
.rowitem{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-bottom:1px solid #eee}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#e3e8ec;color:#69757d;font-weight:700;flex-shrink:0}.rowtext{flex:1;min-width:0}.rowtext strong{font-size:15px}.rowtext small{display:block;color:#899198;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowitem button{background:none;color:#aaa}.chatbody{padding:13px;overflow:auto;flex:1;background:#b5cad7}.date{text-align:center;color:#63727b;font-size:12px;margin:13px}.msg{display:flex;gap:7px;margin:9px 0;align-items:flex-end}.msg.me{justify-content:flex-end}.bubble{max-width:82%;padding:10px 12px;border-radius:16px;background:white;white-space:pre-wrap;line-height:1.45;font-size:14px}.msg.me .bubble{background:#fee500}.sender{font-size:11px;color:#56636a;margin:0 0 4px 3px}.chatinput{display:flex;padding:9px;gap:7px;background:white}.chatinput input{flex:1;min-width:0;border:1px solid #ddd;border-radius:22px;padding:11px}.chatinput button{width:42px;border-radius:50%;background:#fee500;font-weight:bold}
.searchtop{background:#fff;padding:16px}.searchbox{display:flex;border:2px solid #03c75a;border-radius:9px;overflow:hidden}.searchbox input{border:0;outline:0;padding:12px;flex:1;min-width:0}.searchbox button{background:#03c75a;color:white;padding:0 16px}.history{padding:16px;background:#fff}.historyline{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f0f0;font-size:14px}.resultcard{background:white;padding:15px;margin:9px;border-radius:12px}.resultcard small{color:#03a94d}
.ig{background:#fff}.igheader{padding:13px 15px;font-size:21px;font-weight:800;border-bottom:1px solid #eee}.stories{display:flex;gap:13px;padding:13px;overflow:auto;border-bottom:1px solid #eee}.story{width:61px;flex-shrink:0;text-align:center;font-size:11px}.storyring{width:57px;height:57px;border-radius:50%;padding:3px;margin:0 auto 5px;background:linear-gradient(45deg,#ffc400,#ff2878,#9b39c9)}.storyinner{height:100%;border-radius:50%;background:#e8edf0;border:2px solid white;display:grid;place-items:center;color:#65727a}.story.disabled{opacity:.85}.feedpost{padding-bottom:17px;border-bottom:1px solid #eee}.posthead{display:flex;align-items:center;gap:9px;padding:11px}.postpic{height:300px;background:linear-gradient(135deg,#1d344a,#9fb3c6 45%,#1d2633);display:grid;place-items:center;color:white;text-align:center;font-size:25px;font-weight:700;padding:20px}.postactions{padding:10px 13px;font-size:22px}.postcaption{padding:0 13px;font-size:13px;line-height:1.5}.reelcard{margin:12px;border-radius:16px;overflow:hidden;background:#151b24;color:white}.reelposter{height:310px;display:grid;place-items:center;text-align:center;padding:20px;background:linear-gradient(145deg,#18293a,#617b91,#111)}.reelposter a{color:white;font-size:18px;font-weight:700}.reelcard p{padding:0 13px;font-size:13px}.activity{padding:12px;background:white}.activityline{padding:14px 0;border-bottom:1px solid #eee;font-size:14px}.locked{opacity:.65}.locked button{pointer-events:none}.callview{background:radial-gradient(ellipse at top,#596b7d,#15191e 70%);color:white;text-align:center;padding:38px 25px;display:none;flex-direction:column}.contactavatar{width:100px;height:100px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-size:42px;margin:38px auto 15px}.callname{font-size:28px}.callstate{color:#c4cbd1;margin-top:9px}.callscript{font-size:15px;line-height:1.6;margin:40px auto;max-width:300px;min-height:80px}.callcontrols{display:flex;justify-content:center;gap:32px;margin-top:auto;padding-bottom:35px}.callcontrols button{width:64px;height:64px;border-radius:50%;background:#ffffff25;color:white;font-size:24px}.callcontrols .end{background:#e94343}.photoempty{padding:35px;text-align:center;color:#78848c}
@media(min-width:500px){body{padding:18px 0}#phone{height:min(900px,calc(100svh - 36px));border:5px solid #282a2e;border-radius:40px}#setup{min-height:calc(100svh - 36px)}}
</style></head><body>
<section id="setup"><div class="setupcard"><h1>나만의 iPhone</h1><p>휴대폰 주인의 이름을 입력해 줘.</p><input id="ownerInput" maxlength="16" placeholder="이름을 입력해 주세요"><button class="primary" id="start">휴대폰 열기</button></div></section>
<main id="phone"><div class="status"><span>12:57 ▰</span><span>▮▮▮　◉　50%</span></div>
<section id="lock" class="view lock"><div><div class="lockdate">수요일, 11월 4일</div><div class="clock">12:57</div></div><div class="lockhint">화면을 터치하여 잠금 해제</div><div class="lockowner"><span id="lockOwner"></span>의 iPhone<br>위로 쓸어올려 열기</div></section>
<section id="pass" class="view pass"><div style="font-size:18px">암호 입력</div><div id="dots" class="dots"></div><div id="keypad" class="keypad"></div><div id="passerr" style="margin-top:15px;font-size:13px"></div></section>
<section id="home" class="view home"><div class="homehead"><span id="homeDate">11월 4일 수요일</span><span>12:57　◉</span></div><div class="widgetgrid"><div class="widget"><div class="muted">광주 · 현재 날씨</div><div class="weatherbig">⛅</div><div class="temp">16°</div><div class="muted">구름 조금</div></div><div class="widget"><div class="muted">수요일 · 11월</div><div class="calendar"><div class="calnum">4</div><div class="event"><b>오늘의 일정</b><br>일정이 없습니다.</div></div></div></div><div class="appgrid" id="appgrid"></div><div class="dock" id="dock"></div></section>
<section id="app" class="view appview"><div class="bar"><button id="back">‹</button><span id="apptitle">카카오톡</span><button id="more">···</button></div><div id="appcontent" class="scroll"></div><div id="appnav" class="bottomnav"></div></section>
<section id="call" class="view callview"><div style="text-align:right">12:57　◉</div><div class="contactavatar">●</div><div class="callname">박종성</div><div class="callstate" id="callstate">전화 거는 중…</div><div class="callscript" id="callscript"></div><div class="callcontrols"><button>⌕</button><button>◉</button><button class="end" id="endcall">✕</button></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let owner="",entered="",active="",room="",chatMessages=[];
const apps=[["전화","☎","#45c66b"],["카카오톡","●","#fee500"],["인스타그램","◎","#d94b91"],["메시지","▰","#35c96b"],["네이버","N","#03c75a"],["사진","🌈","#fff"],["설정","⚙","#858b91"],["캘린더","4","#fff"]];
function show(id){document.querySelectorAll("#phone>.view").forEach(v=>v.style.display="none");$(id).style.display=id==="app"||id==="call"||id==="lock"?"flex":"block"}
function launch(){owner=$("ownerInput").value.trim();if(!owner){$("ownerInput").focus();return}$("lockOwner").textContent=owner;$("homeDate").textContent="11월 4일 수요일";$("setup").style.display="none";$("phone").style.display="block";show("lock")}
$("start").onclick=launch;$("ownerInput").onkeydown=e=>{if(e.key==="Enter")launch()};$("lock").onclick=()=>{entered="";dots();$("passerr").textContent="";show("pass")};
function dots(){$("dots").innerHTML=[0,1,2,3].map(i=>`<i class="dot ${i<entered.length?"on":""}"></i>`).join("")}
"123456789⌫0".split("").forEach(k=>{let b=document.createElement("button");b.textContent=k==="⌫"?"⌫":k;b.onclick=()=>{entered=k==="⌫"?entered.slice(0,-1):entered.length<4?entered+k:entered;dots();if(entered.length===4){if(entered==="0420")show("home");else{$("passerr").textContent="암호가 올바르지 않습니다.";setTimeout(()=>{entered="";dots()},650)}}};$("keypad").append(b)});
function appButton(a){return `<button class="appbtn" data-open="${a[0]}"><span class="appicon" style="background:${a[2]};color:${a[0]==="카카오톡"?"#392f13":"white"}">${a[1]}</span><div class="appname">${a[0]}</div></button>`}
$("appgrid").innerHTML=apps.map(appButton).join("");$("dock").innerHTML=[apps[0],apps[1],apps[2],apps[3]].map(appButton).join("");
document.addEventListener("click",e=>{let b=e.target.closest("[data-open]");if(b)openApp(b.dataset.open)});
function openApp(name){active=name;show("app");$("apptitle").textContent=name;$("appnav").innerHTML="";let c=$("appcontent");c.innerHTML="";
if(name==="전화")phoneApp(c);if(name==="카카오톡")kakao(c);if(name==="메시지")sms(c);if(name==="인스타그램")instagram(c,"홈");if(name==="네이버")naver(c);if(name==="사진"||name==="설정"||name==="캘린더")c.innerHTML=`<div class="photoempty">${name==="사진"?"사진이 없습니다.":name==="캘린더"?"11월 4일 · 등록된 일정이 없습니다.":"설정 화면"}</div>`;
}
$("back").onclick=()=>show("home");
function nav(items,fn){$("appnav").innerHTML=items.map((x,i)=>`<button data-tab="${x}"><b>${["⌂","⌕","＋","♡","☻"][i]||"•"}</b>${x}</button>`).join("");$("appnav").querySelectorAll("button").forEach(b=>b.onclick=()=>fn(b.dataset.tab))}
function phoneApp(c){c.innerHTML=`<div style="padding:14px;background:white;font-size:22px;font-weight:700">즐겨찾기</div><div class="rowitem"><div class="avatar">●</div><div class="rowtext"><strong>박종성</strong><small>휴대전화 · 최근 통화</small></div><button id="calljong" style="color:#35b967;font-size:23px">☎</button></div><div style="padding:15px;background:white;color:#777">연락처　　키패드　　최근 통화</div>`;$("calljong").onclick=callJong}
function callJong(){show("call");$("callstate").textContent="전화 거는 중…";$("callscript").textContent="";let timer=setTimeout(()=>{$("callstate").textContent="통화 중 · 00:01";let lines=["전화했네? 무슨 일이야?","난 전화 오면 웬만하면 받지 ㅋㅋ","오늘 일정 괜찮아?","필요하면 같이 가 줄게.","천천히 얘기해 봐. 듣고 있어."];let i=0;$("callscript").textContent=lines[i];let iv=setInterval(()=>{i++;if(i<lines.length)$("callscript").textContent=lines[i];else clearInterval(iv)},2600);$("endcall").onclick=()=>{clearInterval(iv);clearTimeout(timer);show("home")}},3000);$("endcall").onclick=()=>{clearTimeout(timer);show("home")}}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
function kakao(c){c.innerHTML=`<div class="rowitem" data-room="jong"><div class="avatar" style="background:#fee500">●</div><div class="rowtext"><strong>박종성</strong><small>보고싶당 머해 ㅋㅋ</small></div><small>1:23</small></div><div class="rowitem" data-room="group"><div class="avatar" style="background:#b8d6c0">👥</div><div class="rowtext"><strong>가은, 세영, ${escapeHtml(owner)}</strong><small>세영: 또 싸우려고 하네 이것들..</small></div><small>오후 4:25</small></div>`;c.querySelectorAll("[data-room]").forEach(x=>x.onclick=()=>openKakaoRoom(x.dataset.room))}
function openKakaoRoom(which){room=which;$("apptitle").textContent=which==="group"?`가은, 세영, ${owner}`:"박종성";let c=$("appcontent");c.innerHTML=`<div class="chatbody" id="chatbody"></div><div class="chatinput"><input id="chattext" placeholder="메시지 입력"><button id="chatsend">↑</button></div>`;chatMessages=which==="group"?[
["date","2026년 11월 2일 오후 4시 25분"],["세영","야 정원이가 반지 사줌ㅠㅠㅠㅠ 우리 반지 맞췄어.."],["가은","와 ㅈㄴ 부럽다. 박성훈 뭐하냐?"],["me",`${owner}도 종성이도 네이버 같이 쓰는거 까먹었는지 반지공방 찾아봄ㅋㅋㅋㅋ`],["가은","박성훈 잡도리 ㅈㄴ 해야겠네 미친놈"],["me","너무 그러지마 언니 봐줘"],["가은","명령 ㄴ"],["세영","또 싸우려고 하네 이것들.."]
]:[["date","2026년 11월 1일 새벽 1시 23분"],["박종성","보고싶네 ㅋㅋ 자냐"],["me","ㅇㅇ 잠 니도 자셈"],["박종성","너무해…ㅠ"],["date","2026년 11월 2일 새벽 2시 01분"],["박종성",`${owner} 뭐하냐. 보고싶어. 자냐? 왜 자꾸 자..`],["me","야 우리 헤어진지 이제 두시간 됐거든? 좀 자라"],["박종성","헤어진다는 말 하지마…"],["me","미친놈"],["date","2026년 11월 4일"],["박종성","보고싶당 머해 ㅋㅋ"]];
renderMessages();$("chatsend").onclick=sendChat;$("chattext").onkeydown=e=>{if(e.key==="Enter")sendChat()}}
function renderMessages(){let b=$("chatbody");b.innerHTML="";chatMessages.forEach(([who,t])=>{if(who==="date"){b.innerHTML+=`<div class="date">${escapeHtml(t)}</div>`;return}let m=document.createElement("div");m.className="msg"+(who==="me"?" me":"");if(who==="me"&&room==="group"){m.innerHTML=`<div><div class="sender">${escapeHtml(owner)}</div><div class="bubble"></div></div>`;}else{m.innerHTML=`${who==="me"?"":`<div class="avatar">${who==="세영"?"S":who==="가은"?"가":"●"}</div>`}<div class="bubble"></div>`;}m.querySelector(".bubble").textContent=t;b.append(m)});b.scrollTop=b.scrollHeight}
function sendChat(){let input=$("chattext"),t=input.value.trim();if(!t)return;chatMessages.push(["me",t]);renderMessages();input.value="";setTimeout(()=>{let ans=genericReply(t);chatMessages.push([room==="group"?(Math.random()>.5?"세영":"가은"):"박종성",ans]);renderMessages()},500)}
function genericReply(t){if(/뭐해|머해/.test(t))return"그냥 쉬고 있어 ㅋㅋ 너는?";if(/고마워/.test(t))return"뭘 이런 걸로 ㅋㅋ";if(/미안/.test(t))return"괜찮아. 무슨 일 있었어?";if(/ㅋㅋ|ㅎㅎ/.test(t))return"ㅋㅋㅋㅋ 진짜냐";if(/밥|먹었/.test(t))return"아직이면 밥부터 챙겨 먹어";if(/어디|갈까|만나/.test(t))return"시간 맞으면 같이 가자. 언제 괜찮아?";if(/사랑해|좋아해/.test(t))return"ㅋㅋ 갑자기? 무슨 일인데";return["아 진짜? 자세히 얘기해 봐 ㅋㅋ","헐 그래서 어떻게 됐는데?","그건 좀 신기한데?","ㅋㅋㅋ 너답다","오케이. 더 말해 봐, 듣고 있어."][Math.floor(Math.random()*5)]}
function sms(c){c.innerHTML=[["2026.04.18","사랑해"],["2026.10.08","나 지금 학원이라 전화 못받음"],["2026.11.01","야 전화 끊고 나랑 전화해"]].map(x=>`<div class="rowitem"><div class="avatar">●</div><div class="rowtext"><strong>박종성</strong><small>${x[1]}</small></div><small>${x[0]}</small></div>`).join("")}
function instagram(c,tab){$("apptitle").textContent="Instagram";$("appnav").innerHTML=`<button data-igt="홈"><b>⌂</b>홈</button><button data-igt="릴스"><b>▣</b>릴스</button><button data-igt="알림"><b>♡</b>알림</button><button data-igt="DM"><b>➤</b>DM</button><button data-igt="프로필"><b>☻</b>프로필</button>`;$("appnav").querySelectorAll("button").forEach(b=>b.onclick=()=>instagram(c,b.dataset.igt));
if(tab==="홈"){c.innerHTML=`<div class="igheader">Instagram</div><div class="stories">${["내 스토리","박성훈","심재윤","박종성"].map((n,i)=>`<div class="story disabled"><div class="storyring"><div class="storyinner">${i===0?"＋":"●"}</div></div>${n}</div>`).join("")}</div><div class="feedpost"><div class="posthead"><div class="avatar">EN</div><b>enhypen</b>　<small>공식 계정</small></div><div class="postpic">ENHYPEN<br><small>OFFICIAL CONTENT</small></div><div class="postactions">♡　◯　➤</div><div class="postcaption"><b>enhypen</b> ENHYPEN 공식 게시물과 릴스를 확인해 보세요.<br><a href="https://www.instagram.com/enhypen/" target="_blank">공식 인스타그램 열기 ↗</a></div></div><div class="feedpost"><div class="posthead"><div class="avatar">EN</div><b>enhypen</b></div><div class="postpic">ENHYPEN<br>YON:der FINALE</div><div class="postcaption">공식 공개 게시물 · <a href="https://www.instagram.com/reel/DfFhBlTBZ/" target="_blank">원본 보기</a></div></div>`}

if(tab==="DM"){c.innerHTML=`<div class="igheader">메시지</div><div class="rowitem locked"><div class="avatar">●</div><div class="rowtext"><strong>박성훈</strong><small>미친놈</small></div><small>읽을 수 없음</small></div><div class="rowitem locked"><div class="avatar">●</div><div class="rowtext"><strong>심재윤</strong><small>병신</small></div><small>읽을 수 없음</small></div>`}

function naver(c){c.innerHTML=`<div class="searchtop"><div style="color:#03c75a;font-size:27px;font-weight:900;margin-bottom:14px">NAVER</div><div class="searchbox"><input id="query" placeholder="검색어를 입력해 주세요"><button id="searchgo">⌕</button></div></div><div id="searcharea"><div class="history"><b>최근 검색어</b><div id="historylist"></div></div></div>`;let history=["고등학생 커플 맛집 추천","데이트 코스 추천","여자친구 생리통","반지공방","여자친구가 너무 좋아서 그런데 어떡하죠?"];function showHistory(){$("historylist").innerHTML=history.map(h=>`<div class="historyline"><span>${h}</span><span>›</span></div>`).join("");$("historylist").querySelectorAll(".historyline").forEach(x=>x.onclick=()=>search(x.firstChild.textContent))}function search(q){q=q.trim();if(!q)return;history=[q,...history.filter(x=>x!==q)].slice(0,10);$("query").value=q;$("searcharea").innerHTML=`<div class="resultcard"><small>통합검색</small><h3>${q}</h3><p>검색어와 관련된 장소, 블로그, 카페 정보를 확인할 수 있습니다.</p></div><div class="resultcard"><b>블로그</b><p>${q} 관련 추천 정보와 후기</p></div><div class="resultcard"><b>플레이스</b><p>주변 장소 검색 결과</p></div><div class="history"><button id="historyback">최근 검색어 보기</button></div>`;$("historyback").onclick=()=>{$("searcharea").innerHTML=`<div class="history"><b>최근 검색어</b><div id="historylist"></div></div>`;showHistory()}}$("searchgo").onclick=()=>search($("query").value);$("query").onkeydown=e=>{if(e.key==="Enter")search(e.target.value)};showHistory()}
</script></body></html>
